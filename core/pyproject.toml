[project]
name = "doorledger"
version = "0.1.0"
description = "DoorLedger core: signed rotating presence codes and doorbell-frame QR reader for home-care visit verification."
requires-python = ">=3.12"
authors = [{ name = "Brandon Garcia" }]
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "segno>=1.6",
    "pillow>=10",
    "httpx>=0.27",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ringpartner[whep]",
    "strands-agents>=1.59.0",
    "reportlab>=5.0.1",
]

[tool.uv.sources]
ringpartner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorledger"]
