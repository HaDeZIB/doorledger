[project]
name = "doorledger-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/ringpartner", "core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/ringpartner/tests", "core/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
