[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CareAgent"
version = "0.1.0"
description = "DoorLedger CareAgent (Strands) on Amazon Bedrock AgentCore Runtime, read-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.59.0",
    "httpx >= 0.27",
    "tzdata",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
